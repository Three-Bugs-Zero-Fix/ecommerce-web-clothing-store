<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div id="admin-loading" class="admin-loading">Checking admin access…</div>

    <div class="admin-shell" id="admin-shell" style="display: none">
      <div class="admin-drawer-overlay" id="admin-drawer-overlay"></div>
      <aside class="admin-drawer" id="admin-drawer">
        <div class="admin-drawer-head">
          <span class="admin-logo">BLUEWEAR</span>
          <button class="admin-drawer-close" id="admin-drawer-close">✕</button>
        </div>
        <nav class="admin-nav">
          <a href="index.html">Dashboard</a>
          <a href="products.html" class="active">Products</a>
          <a href="orders.html">Orders</a>
          <a href="customers.html">Customers</a>
          <a href="coupons.html">Coupons</a>
        </nav>
        <div class="admin-sidebar-bottom">
          <button id="logout-btn">Logout</button>
          <a href="../index.html">‹ View store</a>
        </div>
      </aside>

      <div class="admin-main">
        <div class="admin-topbar">
          <div style="display: flex; align-items: center">
            <button class="admin-hamburger" id="admin-hamburger">☰</button>
            <div class="admin-page-title">Add Product</div>
          </div>
          <div class="admin-topbar-right">
            <a href="products.html" class="back-to-products-link"
              >Back to Products</a
            >
            <div class="admin-avatar" id="admin-avatar">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <defs>
                  <linearGradient
                    id="avatarGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%"
                  >
                    <stop offset="0%" stop-color="#6D5BD0" />
                    <stop offset="100%" stop-color="#2E1F7A" />
                  </linearGradient>
                </defs>
                <path
                  fill="url(#avatarGradient)"
                  d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.8 1.6-9.8 4.9V22h19.6v-2.6c0-3.3-6.5-4.9-9.8-4.9z"
                />
              </svg>
            </div>
          </div>
        </div>

        <div class="admin-content">
          <div class="card-block form-center">
            <div class="form-error" id="form-error"></div>
            <div class="form-success" id="form-success"></div>

            <div class="form-row">
              <label>Product image</label>
              <div class="image-upload-box" id="upload-box">
                <span id="upload-label">Click to choose an image</span>
                <input
                  type="file"
                  id="image-input"
                  accept="image/*"
                  style="display: none"
                />
              </div>
              <img id="image-preview" class="image-preview" />
              <div class="upload-status" id="upload-status"></div>
            </div>

            <div class="form-row">
              <label>Product name</label>
              <input type="text" id="name" />
            </div>

            <div class="form-grid">
              <div class="form-row">
                <label>Category</label>
                <select id="category">
                  <option value="">Select category</option>
                </select>
              </div>
              <div class="form-row">
                <label>Stock quantity</label>
                <input type="number" id="stock" value="10" />
              </div>
            </div>

            <div class="form-grid">
              <div class="form-row">
                <label>Price (৳)</label>
                <input type="number" id="price" />
              </div>
              <div class="form-row">
                <label>Discount price (৳, optional)</label>
                <input type="number" id="discountPrice" />
              </div>
            </div>

            <div class="form-row sizes-featured-row">
              <div class="sizes-col">
                <label>Sizes</label>
                <div class="chip-row" id="sizes-row"></div>
              </div>
              <div class="featured-col">
                <label>Product Type</label>
                <div class="featured-toggle-box" id="featured-toggle-box">
                  <button
                    type="button"
                    class="featured-option selected"
                    data-value="false"
                  >
                    Regular
                  </button>
                  <button
                    type="button"
                    class="featured-option"
                    data-value="true"
                  >
                    Featured
                  </button>
                </div>
              </div>
            </div>

            <div class="form-row">
              <label>Colors (comma separated)</label>
              <input type="text" id="colors" placeholder="Black, White, Navy" />
            </div>

            <div class="form-row">
              <label>Description</label>
              <textarea id="description" rows="3"></textarea>
            </div>

            <div class="form-submit-row">
              <button class="btn-admin-primary" id="submit-btn">
                Save Product
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
    <script src="../js/firebase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
    <script>
      requireAdmin().then((user) => {
        document.getElementById("admin-loading").style.display = "none";
        document.getElementById("admin-shell").style.display = "block";
        const avatar = document.getElementById("admin-avatar");
        avatar.title = user.email;
      });

      // drawer toggle
      const drawer = document.getElementById("admin-drawer");
      const overlay = document.getElementById("admin-drawer-overlay");
      document
        .getElementById("admin-hamburger")
        .addEventListener("click", () => {
          drawer.classList.add("open");
          overlay.classList.add("open");
        });
      document
        .getElementById("admin-drawer-close")
        .addEventListener("click", closeAdminDrawer);
      overlay.addEventListener("click", closeAdminDrawer);
      function closeAdminDrawer() {
        drawer.classList.remove("open");
        overlay.classList.remove("open");
      }

      document
        .getElementById("logout-btn")
        .addEventListener("click", async () => {
          await logoutUser();
          window.location.href = "login.html";
        });

      /* ============================================================
         CATEGORY (single dropdown, grouped by Main Category)
         ============================================================ */
      const CATEGORY_MAP = {
        Men: [
          "Half Sleeve T-Shirt",
          "Full Sleeve T-Shirt",
          "Maggie",
          "Shirt",
          "Polo T-Shirt",
          "Hoodie",
          "Jacket",
          "Joggers",
          "Sweatshirt",
          "Comfy Trouser",
          "Sports Trouser",
          "Shorts",
          "Underwear",
          "Socks",
          "Panjabi",
          "Tupi",
          "Jeans",
          "Pajama",
          "Chino Pants",
          "Cargo Pants",
          "Formal Pants",
          "Sando & Tank Top",
          "Waistcoats",
        ],
        Women: [
          "T-Shirt",
          "Comfy Trouser",
          "Kurti Tunic And Tops",
          "Pajamas",
          "Pants",
          "Palazzo",
          "Leggings",
          "Hoodie",
          "Sweatshirt",
          "Cargo Pants",
          "Shrug",
          "Co-Ords",
          "Tops",
          "Kurti",
          "2pc Salwar Kameez",
          "3pc Salwar Kameez",
          "Denim Pants",
        ],
        Teens: ["Boys", "Girls"],
        Kids: ["Boys", "Girls"],
        Sports: ["Sports T-Shirt", "Football Jersey"],
        "Face Mask": [
          "Professional 7 Layer Mask",
          "Sports Edition",
          "Womens Designer Edition",
          "Womens Embroidery Edition",
          "Kids Mask",
          "Anti Dust & Anti Pollen Mask",
        ],
      };

      function buildCategoryOptions(selectEl) {
        selectEl.innerHTML =
          `<option value="">Select category</option>` +
          Object.entries(CATEGORY_MAP)
            .map(
              ([main, subs]) =>
                `<optgroup label="${main}">${subs.map((s) => `<option value="${s}">${s}</option>`).join("")}</optgroup>`,
            )
            .join("");
      }

      const categorySelect = document.getElementById("category");
      buildCategoryOptions(categorySelect);

      // size chip selector
      const ALL_SIZES = ["S", "M", "L", "XL", "XXL"];
      const selectedSizes = new Set();
      const sizesRow = document.getElementById("sizes-row");
      sizesRow.innerHTML = ALL_SIZES.map(
        (s) => `<div class="chip" data-size="${s}">${s}</div>`,
      ).join("");
      sizesRow.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          const s = chip.dataset.size;
          if (selectedSizes.has(s)) {
            selectedSizes.delete(s);
            chip.classList.remove("selected");
          } else {
            selectedSizes.add(s);
            chip.classList.add("selected");
          }
        });
      });

      // featured / regular toggle
      const featuredBox = document.getElementById("featured-toggle-box");
      let isFeatured = false;
      featuredBox.querySelectorAll(".featured-option").forEach((btn) => {
        btn.addEventListener("click", () => {
          featuredBox
            .querySelectorAll(".featured-option")
            .forEach((b) => b.classList.remove("selected"));
          btn.classList.add("selected");
          isFeatured = btn.dataset.value === "true";
        });
      });

      // image upload
      const uploadBox = document.getElementById("upload-box");
      const imageInput = document.getElementById("image-input");
      const imagePreview = document.getElementById("image-preview");
      const uploadStatus = document.getElementById("upload-status");
      const uploadLabel = document.getElementById("upload-label");
      let uploadedImageUrl = null;

      uploadBox.addEventListener("click", () => imageInput.click());
      imageInput.addEventListener("change", async () => {
        const file = imageInput.files[0];
        if (!file) return;

        imagePreview.src = URL.createObjectURL(file);
        imagePreview.style.display = "block";
        uploadLabel.textContent = file.name;
        uploadStatus.textContent = "Optimizing image…";

        try {
          const jpegFile = await resizeAndConvertToJPEG(file);
          uploadStatus.textContent = "Uploading…";
          uploadedImageUrl = await uploadToImgBB(jpegFile);
          uploadStatus.textContent = "Uploaded ✓";
        } catch (err) {
          uploadStatus.textContent = "Upload failed: " + err.message;
          uploadedImageUrl = null;
        }
      });

      // submit
      document
        .getElementById("submit-btn")
        .addEventListener("click", async () => {
          const errorEl = document.getElementById("form-error");
          const successEl = document.getElementById("form-success");
          showError(errorEl, "");
          showError(successEl, "");

          const name = document.getElementById("name").value.trim();
          const price = Number(document.getElementById("price").value);
          const discountPrice = document.getElementById("discountPrice").value;

          const category = categorySelect.value;
          const selectedOption =
            categorySelect.options[categorySelect.selectedIndex];
          const mainCategory = selectedOption.parentElement.label || "";

          const stock = Number(document.getElementById("stock").value);
          const colors = document
            .getElementById("colors")
            .value.split(",")
            .map((c) => c.trim())
            .filter(Boolean);
          const description = document
            .getElementById("description")
            .value.trim();

          if (!name || !price) {
            showError(errorEl, "Name and price are required.");
            return;
          }
          if (!category) {
            showError(errorEl, "Please select a category.");
            return;
          }
          if (!uploadedImageUrl) {
            showError(
              errorEl,
              "Please wait for the image to finish uploading.",
            );
            return;
          }
          if (selectedSizes.size === 0) {
            showError(errorEl, "Select at least one size.");
            return;
          }

          const btn = document.getElementById("submit-btn");
          btn.disabled = true;
          btn.textContent = "Saving…";

          try {
            await db.collection("products").add({
              name,
              price,
              discountPrice: discountPrice ? Number(discountPrice) : null,
              mainCategory,
              category,
              stock,
              sizes: Array.from(selectedSizes),
              colors,
              description,
              featured: isFeatured,
              image: uploadedImageUrl,
              sku: `BW-${mainCategory.slice(0, 3).toUpperCase()}-${Math.floor(1000 + Math.random() * 9000)}`,
              status: "active",
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
            showError(successEl, "Product saved.");
            document.getElementById("name").value = "";
            document.getElementById("price").value = "";
            document.getElementById("discountPrice").value = "";
            document.getElementById("colors").value = "";
            document.getElementById("description").value = "";
            categorySelect.value = "";
            imagePreview.style.display = "none";
            uploadedImageUrl = null;
            selectedSizes.clear();
            sizesRow
              .querySelectorAll(".chip")
              .forEach((c) => c.classList.remove("selected"));
            isFeatured = false;
            featuredBox
              .querySelectorAll(".featured-option")
              .forEach((b) => b.classList.remove("selected"));
            featuredBox
              .querySelector('[data-value="false"]')
              .classList.add("selected");
          } catch (err) {
            showError(errorEl, err.message);
          } finally {
            btn.disabled = false;
            btn.textContent = "Save Product";
          }
        });
    </script>
  </body>
</html>
