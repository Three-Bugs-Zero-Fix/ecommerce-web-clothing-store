<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — Clothing Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div id="admin-loading" class="admin-loading">Checking admin access…</div>

    <div class="admin-shell" id="admin-shell" style="display: none">
      <!-- Drawer -->
      <div class="admin-drawer-overlay" id="admin-drawer-overlay"></div>
      <aside class="admin-drawer" id="admin-drawer">
        <div class="admin-drawer-head">
          <span class="admin-logo" style="padding: 0">BLUEWEAR</span>
          <button class="admin-drawer-close" id="admin-drawer-close">✕</button>
        </div>
        <nav class="admin-nav">
          <a href="index.html" class="active">Dashboard</a>
          <a href="products.html">Add Products</a>
          <a href="banners.html">Banners</a>
          <a href="orders.html">Orders</a>
          <a href="customers.html">Customers</a>
          <a href="coupons.html">Coupons</a>
        </nav>
        <div class="admin-sidebar-bottom">
          <button id="logout-btn">Logout</button>
          <a href="../index.html">‹ View store</a>
        </div>
      </aside>

      <div class="admin-main">
        <div class="admin-topbar">
          <div style="display: flex; align-items: center">
            <button class="admin-hamburger" id="admin-hamburger">☰</button>
            <div class="admin-page-title">Dashboard</div>
          </div>
          <div class="admin-user-chip" id="admin-email">—</div>
        </div>
        <div class="admin-content">
          <div class="stat-grid" id="stat-grid">
            <div class="stat-card">
              <div class="stat-label">Total Products</div>
              <div class="stat-value" id="stat-products">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Total Orders</div>
              <div class="stat-value" id="stat-orders">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Total Sales</div>
              <div class="stat-value" id="stat-sales">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Pending Orders</div>
              <div class="stat-value warning" id="stat-pending">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Low Stock Items</div>
              <div class="stat-value danger" id="stat-lowstock">—</div>
            </div>
          </div>

          <div class="admin-section-title">Recent Orders</div>
          <div class="card-block">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Customer</th>
                  <th>Total</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="recent-orders-body">
                <tr>
                  <td colspan="5" style="color: #999">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
    <script src="../js/firebase.js"></script>
    <script src="../js/auth.js"></script>
    <script>
      requireAdmin().then(async (user) => {
        document.getElementById("admin-loading").style.display = "none";
        document.getElementById("admin-shell").style.display = "block";
        document.getElementById("admin-email").textContent = user.email;
        await loadDashboard();
      });

      // drawer toggle
      const drawer = document.getElementById("admin-drawer");
      const overlay = document.getElementById("admin-drawer-overlay");
      document
        .getElementById("admin-hamburger")
        .addEventListener("click", () => {
          drawer.classList.add("open");
          overlay.classList.add("open");
        });
      document
        .getElementById("admin-drawer-close")
        .addEventListener("click", closeAdminDrawer);
      overlay.addEventListener("click", closeAdminDrawer);
      function closeAdminDrawer() {
        drawer.classList.remove("open");
        overlay.classList.remove("open");
      }

      document
        .getElementById("logout-btn")
        .addEventListener("click", async () => {
          await logoutUser();
          window.location.href = "login.html";
        });

      async function loadDashboard() {
        const [productsSnap, ordersSnap, lowStockSnap] = await Promise.all([
          db.collection("products").get(),
          db.collection("orders").orderBy("createdAt", "desc").get(),
          db.collection("products").where("stock", "<=", 5).get(),
        ]);

        document.getElementById("stat-products").textContent =
          productsSnap.size;
        document.getElementById("stat-orders").textContent = ordersSnap.size;
        document.getElementById("stat-lowstock").textContent =
          lowStockSnap.size;

        let totalSales = 0,
          pending = 0;
        ordersSnap.forEach((doc) => {
          const o = doc.data();
          totalSales += Number(o.total) || 0;
          if (o.status === "Pending") pending++;
        });
        document.getElementById("stat-sales").textContent =
          `৳${totalSales.toLocaleString("en-BD")}`;
        document.getElementById("stat-pending").textContent = pending;

        const body = document.getElementById("recent-orders-body");
        const recent = ordersSnap.docs.slice(0, 6);
        if (!recent.length) {
          body.innerHTML = `<tr><td colspan="5" style="color:#999;">No orders yet.</td></tr>`;
          return;
        }
        body.innerHTML = recent
          .map((doc) => {
            const o = doc.data();
            const date = o.createdAt?.toDate
              ? o.createdAt.toDate().toLocaleDateString()
              : "";
            return `
        <tr>
          <td>#${doc.id.slice(0, 6)}</td>
          <td>${escapeHtml(o.customerName || "—")}</td>
          <td>৳${o.total || 0}</td>
          <td><span class="pill ${o.status === "Pending" ? "pill-pending" : "pill-active"}">${o.status || "Pending"}</span></td>
          <td>${date}</td>
        </tr>`;
          })
          .join("");
      }

      function escapeHtml(str) {
        return String(str || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
    </script>
  </body>
</html>
