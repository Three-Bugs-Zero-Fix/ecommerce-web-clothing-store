<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Login — BlueWear</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" />

  <link rel="stylesheet" href="../css/auth.css" />

</head>

<body>

  

    <div class="auth-shell">

      <div class="auth-side">
        <div class="brand-mark">BLUEWEAR&nbsp;</div>

        <div>
          <div class="auth-side-copy">
            Admin access. Manage your store from one place.
          </div>

          <div class="auth-side-sub">
            Sign in securely to access the BlueWear administration panel.
          </div>
        </div>

        <div></div>
      </div>

      <div class="auth-main">

        <div class="auth-title">Admin Login</div>

        <div class="auth-subtitle">
          Sign in to access the administration panel.
        </div>

        <div class="error-msg" id="login-error"></div>

        <form id="admin-login-form" novalidate>

          <div class="field">
            <label for="email">Email address</label>

            <input type="email" id="email" autocomplete="username" required />
          </div>

          <div class="field">
            <label for="password">Password</label>

            <div class="field-input-wrap">

              <input type="password" id="password" autocomplete="current-password" required />

              <button type="button" class="toggle-pass" id="show-password">
                Show
              </button>

            </div>
          </div>

          <button type="submit" class="btn-primary" id="login-btn">
            Log in
          </button>

        </form>

        <div class="divider">or</div>

        <a href="../index.html" class="btn-outline">
          Back to store
        </a>

      </div>

    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

    <script src="../js/firebase.js"></script>
    <script src="../js/auth.js"></script>

    <script>
      const form = document.getElementById("admin-login-form");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("login-btn");
      const errorMsg = document.getElementById("login-error");
      const showPasswordBtn = document.getElementById("show-password");

      function showLoginError(message) {
        errorMsg.textContent = message;
        errorMsg.style.display = message ? "block" : "none";
      }

      /* ------------------------------------------------------------
         If already signed in AND is an admin, go straight
         to the admin dashboard.
         ------------------------------------------------------------ */

      auth.onAuthStateChanged(async (user) => {
        if (!user) return;

        const isAdmin = await checkIsAdmin(user);

        if (isAdmin) {
          window.location.href = "index.html";
        } else {
          // A normal customer may already be signed in.
          // Sign them out so this login remains independent.
          await auth.signOut();
        }
      });

      /* ------------------------------------------------------------
         Show / hide password
         ------------------------------------------------------------ */

      showPasswordBtn.addEventListener("click", () => {
        const hidden = passwordInput.type === "password";

        passwordInput.type = hidden ? "text" : "password";
        showPasswordBtn.textContent = hidden ? "Hide" : "Show";
      });

      /* ------------------------------------------------------------
         Admin login
         ------------------------------------------------------------ */

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        showLoginError("");

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showLoginError("Enter your email and password.");
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in…";

        try {
          const user = await loginUser({
            email,
            password,
          });

          const isAdmin = await checkIsAdmin(user);

          if (!isAdmin) {
            await auth.signOut();

            showLoginError(
              "You do not have permission to access the admin panel."
            );

            return;
          }

          window.location.href = "index.html";

        } catch (error) {
          showLoginError(friendlyAuthError(error));
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "Log in";
        }
      });
    </script>
  </body>

</html>
