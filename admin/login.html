<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Login — BlueWear</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    />

    <link rel="stylesheet" href="../css/admin.css" />

    <style>
      .admin-login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--a-bg);
      }

      .admin-login-card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid var(--a-line);
        border-radius: 14px;
        padding: 32px;
        box-shadow: 0 8px 30px rgba(34, 34, 31, 0.06);
      }

      .admin-login-brand {
        font-family: var(--a-head-font);
        font-size: 22px;
        color: var(--a-blue-deep);
        margin-bottom: 28px;
      }

      .admin-login-title {
        font-family: var(--a-head-font);
        font-size: 25px;
        margin-bottom: 6px;
      }

      .admin-login-subtitle {
        font-size: 13px;
        color: var(--a-ink-soft);
        margin-bottom: 24px;
      }

      .admin-login-field {
        margin-bottom: 16px;
      }

      .admin-login-field label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 6px;
      }

      .admin-login-field input {
        width: 100%;
        padding: 11px 12px;
        border: 1.5px solid var(--a-line);
        border-radius: 8px;
        font-family: var(--a-body-font);
        font-size: 13.5px;
        background: #fff;
      }

      .admin-login-field input:focus {
        outline: none;
        border-color: var(--a-blue);
        box-shadow: 0 0 0 3px var(--a-blue-tint);
      }

      .admin-password-wrap {
        position: relative;
      }

      .admin-password-wrap input {
        padding-right: 58px;
      }

      .admin-show-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: none;
        color: var(--a-blue);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .admin-login-error {
        display: none;
        background: #fbeae9;
        color: var(--a-danger);
        border: 1px solid #f1c7c4;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 12.5px;
        margin-bottom: 16px;
      }

      .admin-login-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: var(--a-blue);
        color: #fff;
        font-family: var(--a-body-font);
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
      }

      .admin-login-btn:hover {
        background: var(--a-blue-deep);
      }

      .admin-login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .admin-login-back {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: var(--a-ink-soft);
        font-size: 12.5px;
        text-decoration: none;
      }

      .admin-login-back:hover {
        color: var(--a-blue);
      }
    </style>
  </head>

  <body>
    <div class="admin-login-page">
      <div class="admin-login-card">

        <div class="admin-login-brand">BLUEWEAR ADMIN</div>

        <div class="admin-login-title">Admin Login</div>

        <div class="admin-login-subtitle">
          Sign in to access the administration panel.
        </div>

        <div class="admin-login-error" id="login-error"></div>

        <form id="admin-login-form">

          <div class="admin-login-field">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              autocomplete="username"
              required
            />
          </div>

          <div class="admin-login-field">
            <label for="password">Password</label>

            <div class="admin-password-wrap">
              <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="admin-show-password"
                id="show-password"
              >
                Show
              </button>
            </div>
          </div>

          <button
            type="submit"
            class="admin-login-btn"
            id="login-btn"
          >
            Log in
          </button>

        </form>

        <a href="../index.html" class="admin-login-back">
          ‹ Back to store
        </a>

      </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

    <script src="../js/firebase.js"></script>
    <script src="../js/auth.js"></script>

    <script>
      const form = document.getElementById("admin-login-form");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("login-btn");
      const errorMsg = document.getElementById("login-error");
      const showPasswordBtn = document.getElementById("show-password");

      function showLoginError(message) {
        errorMsg.textContent = message;
        errorMsg.style.display = message ? "block" : "none";
      }

      /* ------------------------------------------------------------
         If already signed in AND is an admin, go straight
         to the admin dashboard.
         ------------------------------------------------------------ */

      auth.onAuthStateChanged(async (user) => {
        if (!user) return;

        const isAdmin = await checkIsAdmin(user);

        if (isAdmin) {
          window.location.href = "index.html";
        } else {
          // A normal customer may already be signed in.
          // Sign them out so this login remains independent.
          await auth.signOut();
        }
      });

      /* ------------------------------------------------------------
         Show / hide password
         ------------------------------------------------------------ */

      showPasswordBtn.addEventListener("click", () => {
        const hidden = passwordInput.type === "password";

        passwordInput.type = hidden ? "text" : "password";
        showPasswordBtn.textContent = hidden ? "Hide" : "Show";
      });

      /* ------------------------------------------------------------
         Admin login
         ------------------------------------------------------------ */

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        showLoginError("");

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showLoginError("Enter your email and password.");
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in…";

        try {
          const user = await loginUser({
            email,
            password,
          });

          const isAdmin = await checkIsAdmin(user);

          if (!isAdmin) {
            await auth.signOut();

            showLoginError(
              "You do not have permission to access the admin panel."
            );

            return;
          }

          window.location.href = "index.html";

        } catch (error) {
          showLoginError(friendlyAuthError(error));
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "Log in";
        }
      });
    </script>
  </body>
</html>
