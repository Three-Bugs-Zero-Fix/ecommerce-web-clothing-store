<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist - BlueWear</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/shop.css">
    <link rel="stylesheet" href="../css/wishlist.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->
    <header class="navbar">
        <div class="container navbar-inner">

            <a href="../index.html" class="logo">
                <span class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M6 2l1.5 4h9L18 2" />
                        <path d="M3.5 6h17l-1.2 13a2 2 0 0 1-2 1.8H6.7a2 2 0 0 1-2-1.8L3.5 6z" />
                        <path d="M8.5 10a3.5 3.5 0 0 0 7 0" />
                    </svg>
                </span>

                <span class="logo-text">BlueWear</span>
            </a>

            <nav class="nav-menu" aria-label="Main navigation">
                <a href="../index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="../index.html#categories">Categories</a>
                <a href="../index.html#about">About</a>
            </nav>

            <div class="nav-actions">

                <a href="cart.html" class="cart-btn" id="cart-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M16 5h6" />
                        <path d="M19 2v6" />
                        <path d="m2.05 2.05 1.099-.028a1 1 0 011.008.815l2.69 14.347A1 1 0 007.83 18H18" />
                        <path d="M4.564 5H12" />
                        <path d="M6.25 14h12.712a2 2 0 001.991-1.57l.172-1.041" />
                        <circle cx="18" cy="20" r="2" />
                        <circle cx="8" cy="20" r="2" />
                    </svg>

                    <span>
                        Cart (<span id="nav-cart-count">0</span>)
                    </span>
                </a>

                <button type="button" class="profile-btn profile-btn-guest" id="profile-btn"
                    aria-label="Open account menu">
                    <span id="profile-btn-content">👤</span>
                </button>

            </div>
        </div>
    </header>


    <!-- =========================
         WISHLIST
    ========================== -->
    <main class="container wishlist-page">

        <section class="wishlist-header">
            <div>
                <p class="wishlist-label">YOUR COLLECTION</p>
                <h1>My Wishlist</h1>
                <p class="wishlist-subtitle">
                    Items you've saved for later.
                </p>
            </div>
        </section>


        <div id="wishlist-loading" class="wishlist-loading">
            <div class="wishlist-loading-spinner"></div>
            <span>Loading your wishlist...</span>
        </div>


        <div class="wishlist-content shop-products" id="wishlist-content" style="display: none;">
            <div class="product-grid" id="wishlist-grid"></div>
        </div>

    </main>


    <!-- =========================
         FIREBASE
    ========================== -->
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

    <script src="../js/firebase.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/profile_drawer.js"></script>


    <script>
        const wishlistGrid = document.getElementById("wishlist-grid");
        const loadingEl = document.getElementById("wishlist-loading");
        const contentEl = document.getElementById("wishlist-content");

        // =========================
        // AUTHENTICATION
        // =========================

        auth.onAuthStateChanged((user) => {
            if (!user) {
                alert("Please log in to view your wishlist.");
                window.location.href = "login.html";
            } else {
                loadWishlist(user.uid);
            }
        });


        // =========================
        // LOAD WISHLIST
        // =========================

        async function loadWishlist(uid) {
            try {
                const snapshot = await db
                    .collection("users")
                    .doc(uid)
                    .collection("wishlist")
                    .orderBy("addedAt", "desc")
                    .get();

                loadingEl.style.display = "none";
                contentEl.style.display = "block";

                if (snapshot.empty) {
                    wishlistGrid.classList.add("wishlist-empty-grid");

                    wishlistGrid.innerHTML = `
                        <div class="empty-wishlist">

                            <div class="empty-wishlist-icon">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                >
                                    <path d="M20.8 8.7c0 5.4-8.8 10.3-8.8 10.3S3.2 14.1 3.2 8.7A4.7 4.7 0 0 1 12 6.1a4.7 4.7 0 0 1 8.8 2.6Z" />
                                </svg>
                            </div>

                            <h2>Your wishlist is empty</h2>

                            <p>
                                Save your favorite pieces here and come back
                                whenever you're ready.
                            </p>

                            <a href="shop.html" class="primary-btn empty-wishlist-btn">
                                Explore Shop
                            </a>

                        </div>
                    `;

                    return;
                }

                wishlistGrid.classList.remove("wishlist-empty-grid");

                let html = "";

                snapshot.forEach(doc => {
                    const item = doc.data();

                    html += `
                        <article class="product-card wishlist-card">

                            <div class="wishlist-image-wrap">

                                <a
                                    href="product_details.html?id=${encodeURIComponent(item.productId)}"
                                    class="product-image"
                                >
                                    <img
                                        src="${escapeHtml(item.image || "")}"
                                        alt="${escapeHtml(item.name || "Product")}"
                                        loading="lazy"
                                    >
                                </a>

                                <button
                                    type="button"
                                    class="wishlist-remove-icon"
                                    title="Remove from wishlist"
                                    aria-label="Remove ${escapeHtml(item.name || "product")} from wishlist"
                                    onclick="removeFromWishlist('${doc.id}', '${uid}')"
                                >
                                    ♥
                                </button>

                            </div>

                            <div class="product-details">

                                <h3 class="wishlist-product-name">
                                    ${escapeHtml(item.name || "Unnamed Product")}
                                </h3>

                                <div class="price-row">

                                    <span class="price-current">
                                        ৳${Number(item.price || 0).toLocaleString()}
                                    </span>

                                    <button
                                        type="button"
                                        class="cart-icon-btn"
                                        title="Add to cart"
                                        onclick="addToCart(
                                            '${escapeHtml(item.productId)}',
                                            '${escapeHtml(item.name || "Product")}',
                                            ${Number(item.price || 0)},
                                            '${escapeHtml(item.image || "")}'
                                        )"
                                    >
                                        <svg
                                            xmlns="http://www.w3.org/2000/svg"
                                            width="18"
                                            height="18"
                                            viewBox="0 0 24 24"
                                            fill="none"
                                            stroke="currentColor"
                                            stroke-width="2"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        >
                                            <path d="M16 5h6" />
                                            <path d="M19 2v6" />
                                            <path d="m2.05 2.05 1.099-.028a1 1 0 011.008.815l2.69 14.347A1 1 0 007.83 18H18" />
                                            <path d="M4.564 5H12" />
                                            <path d="M6.25 14h12.712a2 2 0 001.991-1.57l.172-1.041" />
                                            <circle cx="18" cy="20" r="2" />
                                            <circle cx="8" cy="20" r="2" />
                                        </svg>
                                    </button>

                                </div>

                                <button
                                    type="button"
                                    class="remove-wishlist-btn"
                                    onclick="removeFromWishlist('${doc.id}', '${uid}')"
                                >
                                    Remove from Wishlist
                                </button>

                            </div>

                        </article>
                    `;
                });

                wishlistGrid.innerHTML = html;

            } catch (error) {
                console.error("Error loading wishlist:", error);

                loadingEl.innerHTML = `
                    <div class="wishlist-error">
                        <strong>Couldn't load your wishlist</strong>
                        <span>Please check your connection and try again.</span>
                    </div>
                `;
            }
        }


        // =========================
        // REMOVE FROM WISHLIST
        // =========================

        async function removeFromWishlist(docId, uid) {
            if (!confirm("Are you sure you want to remove this item?")) {
                return;
            }

            try {
                await db
                    .collection("users")
                    .doc(uid)
                    .collection("wishlist")
                    .doc(docId)
                    .delete();

                loadWishlist(uid);

            } catch (error) {
                console.error("Error removing item:", error);
                alert("Could not remove item. Please try again.");
            }
        }


        // =========================
        // HTML ESCAPE
        // =========================

        function escapeHtml(value) {
            return String(value || "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[character]));
        }
    </script>

</body>

</html>
