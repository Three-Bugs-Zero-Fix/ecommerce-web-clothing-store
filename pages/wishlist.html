<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - BlueWear</title>
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/shop.css"> <!-- Using shop styles for product cards -->
    
    <style>
        .wishlist-page { padding: 50px 0; min-height: 60vh; }
        .wishlist-header h1 { font-size: 32px; margin-bottom: 30px; color: #172033; }
        .empty-wishlist { text-align: center; padding: 60px 20px; background: #f9fafb; border-radius: 12px; border: 1px dashed #d0d5dd; }
        .empty-wishlist h2 { color: #172033; margin-bottom: 10px; }
        .empty-wishlist p { color: #667085; margin-bottom: 20px; }
        
        .remove-wishlist-btn { 
            width: 100%; 
            margin-top: 12px; 
            background: #fff; 
            color: #d12e2e; 
            border: 1px solid #f1c7c4; 
            padding: 8px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: 0.2s;
        }
        .remove-wishlist-btn:hover { background: #fdeaea; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container navbar-inner">
            <a href="../index.html" class="logo">BLUEWEAR</a>
            <div class="nav-actions">
                <a href="cart.html" class="cart-btn" style="text-decoration: none;">
                    Cart (<span id="nav-cart-count">0</span>)
                </a>
                <a href="profile.html" class="profile-btn profile-btn-avatar">
                    <span id="profile-btn-content">👤</span>
                </a>
            </div>
        </div>
    </header>

    <!-- WISHLIST MAIN SECTION -->
    <main class="container wishlist-page">
        <div class="wishlist-header">
            <h1>My Saved Designs ♥</h1>
        </div>

        <div id="wishlist-loading" style="text-align: center; color: #666; padding: 40px 0; font-size: 18px;">
            Loading your wishlist...
        </div>
        
        <div class="shop-products" id="wishlist-content" style="display: none;">
            <div class="product-grid" id="wishlist-grid">
                <!-- JS will inject wishlist items here -->
            </div>
        </div>
    </main>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
    <script src="../js/firebase.js"></script>
    
    <!-- Needed for the Cart Button -->
    <script src="../js/cart.js"></script>

    <script>
        const wishlistGrid = document.getElementById("wishlist-grid");
        const loadingEl = document.getElementById("wishlist-loading");
        const contentEl = document.getElementById("wishlist-content");

        // 1. AUTHENTICATION GUARD
        auth.onAuthStateChanged((user) => {
            if (!user) {
                alert("Please log in to view your wishlist.");
                window.location.href = "login.html";
            } else {
                loadWishlist(user.uid);
            }
        });

        // 2. LOAD WISHLIST FROM FIRESTORE
        async function loadWishlist(uid) {
            try {
                // Fetch user's wishlist ordered by the time they added it
                const snapshot = await db.collection("users").doc(uid).collection("wishlist").orderBy("addedAt", "desc").get();
                
                loadingEl.style.display = "none";
                contentEl.style.display = "block";

                // If wishlist is empty
                if (snapshot.empty) {
                    wishlistGrid.style.display = "block"; // override grid layout for empty state
                    wishlistGrid.innerHTML = `
                        <div class="empty-wishlist">
                            <h2>Your wishlist is empty</h2>
                            <p>Explore the shop and tap the heart icon to save your favorite items here!</p>
                            <a href="shop.html" class="primary-btn" style="display:inline-block; text-decoration:none;">Go to Shop</a>
                        </div>`;
                    return;
                }

                // Render products using shop.css styles
                let html = "";
                snapshot.forEach(doc => {
                    const item = doc.data();
                    html += `
                        <article class="product-card">
                            <a href="product_details.html?id=${item.productId}" class="product-image">
                                <img src="${item.image}" alt="${item.name}" loading="lazy">
                            </a>
                            <div class="product-details">
                                <h3 style="font-size:16px; margin-bottom:10px;">${item.name}</h3>
                                
                                <div class="price-row">
                                    <span class="price-current">৳${item.price.toLocaleString()}</span>
                                    <button class="cart-icon-btn" title="Add to cart" onclick="addToCart('${item.productId}', '${item.name}', ${item.price}, '${item.image}')">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5h6"/><path d="M19 2v6"/><path d="m2.05 2.05 1.099-.028a1 1 0 011.008.815l2.69 14.347A1 1 0 007.83 18H18"/><path d="M4.564 5H12"/><path d="M6.25 14h12.712a2 2 0 001.991-1.57l.172-1.041"/><circle cx="18" cy="20" r="2"/><circle cx="8" cy="20" r="2"/></svg>
                                    </button>
                                </div>

                                <button class="remove-wishlist-btn" onclick="removeFromWishlist('${doc.id}', '${uid}')">
                                    Remove from Wishlist
                                </button>
                            </div>
                        </article>
                    `;
                });

                wishlistGrid.innerHTML = html;

            } catch (error) {
                console.error("Error loading wishlist:", error);
                loadingEl.textContent = "Failed to load wishlist. Please check your internet connection.";
            }
        }

        // 3. REMOVE FROM WISHLIST
        async function removeFromWishlist(docId, uid) {
            if(!confirm("Are you sure you want to remove this item?")) return;
            
            try {
                await db.collection("users").doc(uid).collection("wishlist").doc(docId).delete();
                // Reload the list after deleting
                loadWishlist(uid); 
            } catch (error) {
                console.error("Error removing item:", error);
                alert("Could not remove item. Please try again.");
            }
        }
    </script>
</body>
</html>
