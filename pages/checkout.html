<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - BlueWear</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/checkout.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container navbar-inner">

            <a href="../index.html" class="logo">
                <span class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M6 2l1.5 4h9L18 2" />
                        <path d="M3.5 6h17l-1.2 13a2 2 0 0 1-2 1.8H6.7a2 2 0 0 1-2-1.8L3.5 6z" />
                        <path d="M8.5 10a3.5 3.5 0 0 0 7 0" />
                    </svg>
                </span>

                <span class="logo-text">BlueWear</span>
            </a>

            <nav class="nav-menu" aria-label="Main navigation">
                <a href="../index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="../index.html#categories">Categories</a>
                <a href="../index.html#about">About</a>
            </nav>

            <div class="nav-actions">

                <!-- CART -->
                <a href="cart.html" class="cart-btn" id="cart-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M16 5h6" />
                        <path d="M19 2v6" />
                        <path d="m2.05 2.05 1.099-.028a1 1 0 011.008.815l2.69 14.347A1 1 0 007.83 18H18" />
                        <path d="M4.564 5H12" />
                        <path d="M6.25 14h12.712a2 2 0 001.991-1.57l.172-1.041" />
                        <circle cx="18" cy="20" r="2" />
                        <circle cx="8" cy="20" r="2" />
                    </svg>

                    <span>
                        Cart (<span id="nav-cart-count">0</span>)
                    </span>
                </a>

                <!-- PROFILE -->
                <button type="button" class="profile-btn profile-btn-guest" id="profile-btn"
                    aria-label="Open account menu">
                    <span id="profile-btn-content">👤</span>
                </button>

            </div>
        </div>
    </header>

    <!-- CHECKOUT MAIN SECTION -->
    <main class="container checkout-page" style="display: none;" id="checkout-main">
        <div class="checkout-header">
            <h1>Checkout</h1>
        </div>

        <div class="checkout-layout">

            <!-- Left Side: Shipping & Payment Form -->
            <div class="checkout-form-section">
                <form id="checkout-form">

                    <h3>Shipping Information</h3>

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="ship-name" required placeholder="e.g. John Doe">
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="ship-phone" required placeholder="017XXXXXXXX">
                    </div>

                    <div class="form-group">
                        <label>Delivery Address</label>
                        <textarea id="ship-address" rows="3" required placeholder="House, Road, Area"></textarea>
                    </div>

                    <div class="form-row">
                        <!-- UPDATE: Changed input-group to form-group and removed inline styles -->
                        <div class="form-group">
                            <label for="ship-city">City / District</label>
                            <select id="ship-city" required>
                                <option value="" disabled selected>Select your district...</option>
                                <!-- Inside Dhaka -->
                                <option value="Dhaka">Dhaka</option>

                                <!-- Outside Dhaka -->
                                <option value="Bagerhat">Bagerhat</option>
                                <option value="Bandarban">Bandarban</option>
                                <option value="Barguna">Barguna</option>
                                <option value="Barishal">Barishal</option>
                                <option value="Bhola">Bhola</option>
                                <option value="Bogura">Bogura</option>
                                <option value="Brahmanbaria">Brahmanbaria</option>
                                <option value="Chandpur">Chandpur</option>
                                <option value="Chattogram">Chattogram</option>
                                <option value="Chuadanga">Chuadanga</option>
                                <option value="Cox's Bazar">Cox's Bazar</option>
                                <option value="Cumilla">Cumilla</option>
                                <option value="Dinajpur">Dinajpur</option>
                                <option value="Faridpur">Faridpur</option>
                                <option value="Feni">Feni</option>
                                <option value="Gaibandha">Gaibandha</option>
                                <option value="Gazipur">Gazipur</option>
                                <option value="Gopalganj">Gopalganj</option>
                                <option value="Habiganj">Habiganj</option>
                                <option value="Jamalpur">Jamalpur</option>
                                <option value="Jashore">Jashore</option>
                                <option value="Jhalokati">Jhalokati</option>
                                <option value="Jhenaidah">Jhenaidah</option>
                                <option value="Joypurhat">Joypurhat</option>
                                <option value="Khagrachari">Khagrachari</option>
                                <option value="Khulna">Khulna</option>
                                <option value="Kishoreganj">Kishoreganj</option>
                                <option value="Kurigram">Kurigram</option>
                                <option value="Kushtia">Kushtia</option>
                                <option value="Lakshmipur">Lakshmipur</option>
                                <option value="Lalmonirhat">Lalmonirhat</option>
                                <option value="Madaripur">Madaripur</option>
                                <option value="Magura">Magura</option>
                                <option value="Manikganj">Manikganj</option>
                                <option value="Meherpur">Meherpur</option>
                                <option value="Moulvibazar">Moulvibazar</option>
                                <option value="Munshiganj">Munshiganj</option>
                                <option value="Mymensingh">Mymensingh</option>
                                <option value="Naogaon">Naogaon</option>
                                <option value="Narail">Narail</option>
                                <option value="Narayanganj">Narayanganj</option>
                                <option value="Narsingdi">Narsingdi</option>
                                <option value="Natore">Natore</option>
                                <option value="Nawabganj">Nawabganj</option>
                                <option value="Netrokona">Netrokona</option>
                                <option value="Nilphamari">Nilphamari</option>
                                <option value="Noakhali">Noakhali</option>
                                <option value="Pabna">Pabna</option>
                                <option value="Panchagarh">Panchagarh</option>
                                <option value="Patuakhali">Patuakhali</option>
                                <option value="Pirojpur">Pirojpur</option>
                                <option value="Rajbari">Rajbari</option>
                                <option value="Rajshahi">Rajshahi</option>
                                <option value="Rangamati">Rangamati</option>
                                <option value="Rangpur">Rangpur</option>
                                <option value="Satkhira">Satkhira</option>
                                <option value="Shariatpur">Shariatpur</option>
                                <option value="Sherpur">Sherpur</option>
                                <option value="Sirajganj">Sirajganj</option>
                                <option value="Sunamganj">Sunamganj</option>
                                <option value="Sylhet">Sylhet</option>
                                <option value="Tangail">Tangail</option>
                                <option value="Thakurgaon">Thakurgaon</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Postal Code</label>
                            <input type="text" id="ship-zip" required placeholder="1200">
                        </div>
                    </div>

                    <!-- Updated Payment Methods -->
                    <h3>Payment Method</h3>
                    <div class="payment-methods-container">

                        <label class="payment-method">
                            <input type="radio" name="payment" value="COD" checked>
                            Cash on Delivery (COD)
                        </label>

                        <label class="payment-method">
                            <input type="radio" name="payment" value="bKash">
                            bKash
                        </label>

                        <label class="payment-method">
                            <input type="radio" name="payment" value="SSLCOMMERZ">
                            SSLCOMMERZ (Visa / MasterCard)
                        </label>

                    </div>

                    <button type="submit" class="primary-btn place-order-btn" id="place-order-btn">
                        Place Order
                    </button>
                </form>
            </div>

            <!-- Right Side: Order Summary -->
            <div class="checkout-summary-section">
                <h3>Order Summary</h3>
                <div id="checkout-items-container">
                    <!-- JS will load items here -->
                </div>

                <hr class="summary-divider">

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">৳0</span>
                </div>

                <div class="summary-row">
                    <span>Shipping Fee</span>
                    <span id="checkout-shipping">৳60</span>
                </div>

                <hr class="summary-divider">

                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="checkout-total">৳0</span>
                </div>
            </div>

        </div>
    </main>

    <!-- PROFILE DRAWER -->
    
    <!-- Loading Screen (Shows while checking auth) -->
    <div id="auth-loading" style="text-align: center; padding: 100px 0; font-size: 18px; color: #666;">
        Checking secure connection...
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

    <script src="../js/firebase.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/profile_drawer.js"></script>
    <script src="../js/checkout.js"></script>

</body>

</html>
