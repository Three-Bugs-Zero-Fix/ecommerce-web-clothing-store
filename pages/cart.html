<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - BlueWear</title>
    <!-- Link to existing global style and new cart style -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container navbar-inner">
            <a href="../index.html" class="logo">BLUEWEAR</a>

            <nav class="nav-menu">
                <a href="../index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="../index.html#categories">Categories</a>
                <a href="../index.html#about">About</a>
            </nav>

            <div class="nav-actions">
                <button class="nav-btn">Search</button>
                <a href="cart.html" class="cart-btn" style="text-decoration: none; display: flex; align-items: center;">
                    Cart (<span id="nav-cart-count">0</span>)
                </a>
                <a href="login.html" class="profile-btn profile-btn-guest">
                    <span id="profile-btn-content">👤</span>
                </a>
            </div>
        </div>
    </header>

    <!-- CART MAIN SECTION -->
    <main class="container cart-page">
        <div class="cart-header">
            <h1>Your Cart</h1>
        </div>

        <div class="cart-layout">
            <!-- Left side: Cart Items -->
            <div class="cart-items-section" id="cart-items-container">
                <!-- JS will inject items here -->
                <p class="empty-cart-msg">Loading your cart...</p>
            </div>

            <!-- Right side: Order Summary -->
            <div class="cart-summary-section">
                <h3>Order Summary</h3>
                
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="summary-subtotal">৳0</span>
                </div>
                
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Calculated at checkout</span>
                </div>
                
                <hr class="summary-divider">
                
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="summary-total">৳0</span>
                </div>

                <a href="checkout.html" class="primary-btn checkout-btn">Proceed to Checkout</a>
            </div>
        </div>
    </main>

    <!-- JS Files -->
    <script src="../js/cart.js"></script>
</body>
</html>
