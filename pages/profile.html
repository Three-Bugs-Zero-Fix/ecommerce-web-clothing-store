<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My account — Clothing Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div id="loading" class="loading-shell">Checking your session…</div>

    <div class="profile-shell" id="profile-shell" style="display: none">
      <div class="profile-header">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="profile-name" id="profile-name">—</div>
          <div class="profile-email" id="profile-email">—</div>
        </div>
      </div>

      <div class="error-msg" id="error-msg"></div>
      <div class="success-msg" id="success-msg"></div>

      <div class="profile-section">
        <div class="profile-section-title">Edit name</div>
        <div class="field">
          <label for="edit-name">Full name</label>
          <input type="text" id="edit-name" />
        </div>
        <button
          class="btn-primary"
          id="save-name-btn"
          style="width: auto; padding: 10px 22px"
        >
          Save changes
        </button>
      </div>

      <div class="profile-section">
        <nav class="account-menu">
          <a href="dashboard.html" class="menu-item">
            <span class="menu-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="3" y="3" width="8" height="8" rx="1.5" />
                <rect x="13" y="3" width="8" height="8" rx="1.5" />
                <rect x="3" y="13" width="8" height="8" rx="1.5" />
                <rect x="13" y="13" width="8" height="8" rx="1.5" />
              </svg>
            </span>
            <span class="menu-label">Dashboard</span>
            <span class="menu-arrow">›</span>
          </a>

          <a href="orders.html" class="menu-item">
            <span class="menu-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="M4 8h16l-1 12H5L4 8z" />
                <path d="M8 8V6a4 4 0 0 1 8 0v2" />
              </svg>
            </span>
            <span class="menu-label">My Orders</span>
            <span class="menu-arrow">›</span>
          </a>

          <a href="track-order.html" class="menu-item">
            <span class="menu-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="1" y="7" width="13" height="9" rx="1" />
                <path d="M14 10h4l3 3v3h-7z" />
                <circle cx="6" cy="18" r="1.6" />
                <circle cx="17" cy="18" r="1.6" />
              </svg>
            </span>
            <span class="menu-label">Track Order</span>
            <span class="menu-arrow">›</span>
          </a>

          <a href="wishlist.html" class="menu-item">
            <span class="menu-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  d="M12 20s-7-4.4-9.3-8.7C1.2 8 2.6 5 5.8 5c1.8 0 3.2 1 4.2 2.4C11 6 12.4 5 14.2 5c3.2 0 4.6 3 3.1 6.3C19 15.6 12 20 12 20z"
                />
              </svg>
            </span>
            <span class="menu-label">Saved Designs</span>
            <span class="menu-arrow">›</span>
          </a>

          <div class="menu-divider"></div>

          <a href="payout.html" class="menu-item">
            <span class="menu-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="2" y="6" width="20" height="13" rx="2" />
                <path d="M2 10h20" />
                <circle cx="7" cy="14.5" r="1" />
              </svg>
            </span>
            <span class="menu-label">Payout</span>
            <span class="menu-arrow">›</span>
          </a>

          <div class="menu-divider"></div>

          <button
            type="button"
            class="menu-item menu-item-danger"
            id="logout-btn"
          >
            <span class="menu-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <path d="M16 17l5-5-5-5" />
                <path d="M21 12H9" />
              </svg>
            </span>
            <span class="menu-label">Logout</span>
          </button>
        </nav>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
    <script src="../js/firebase.js"></script>
    <script src="../js/auth.js"></script>
    <script>
      const loading = document.getElementById("loading");
      const shell = document.getElementById("profile-shell");
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");

      requireAuth("login.html").then((user) => {
        loading.style.display = "none";
        shell.style.display = "block";

        const name = user.displayName || "";
        document.getElementById("profile-name").textContent =
          name || "Unnamed customer";
        document.getElementById("profile-email").textContent = user.email;
        document.getElementById("edit-name").value = name;
        document.getElementById("avatar").textContent = (
          name ||
          user.email ||
          "?"
        )
          .charAt(0)
          .toUpperCase();
      });

      document
        .getElementById("save-name-btn")
        .addEventListener("click", async () => {
          showError(errorMsg, "");
          showError(successMsg, "");
          const newName = document.getElementById("edit-name").value.trim();
          if (!newName) {
            showError(errorMsg, "Name can't be empty.");
            return;
          }
          try {
            await updateDisplayName(newName);
            document.getElementById("profile-name").textContent = newName;
            document.getElementById("avatar").textContent = newName
              .charAt(0)
              .toUpperCase();
            showError(successMsg, "Profile updated.");
          } catch (err) {
            showError(errorMsg, friendlyAuthError(err));
          }
        });

      document
        .getElementById("logout-btn")
        .addEventListener("click", async () => {
          await logoutUser();
          window.location.href = "login.html";
        });
    </script>
  </body>
</html>
